<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Liquid Glass Core</title>
    <link rel="stylesheet" href="/static/css/liquid_glass.css">
</head>
<body>

    <!-- Black curtain that slowly fades away after 2.45s -->
    <div id="boot-curtain"></div>

    <!-- Persistent SVG container: starts centered for 2.45s, freezes, then shrinks into the top header -->
    <header id="brand-header" class="state-booting">
        <div id="boot-svg-container"></div>
    </header>

    <!-- Multi-Layer Parallax Background (SVG / PNG) -->
    <div id="parallax-viewport">
        <div id="parallax-bg-layer" class="parallax-layer" data-depth="0.04">
            <svg id="default-bg-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <radialGradient id="orb1" cx="30%" cy="30%" r="50%">
                        <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/>
                        <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
                    </radialGradient>
                    <radialGradient id="orb2" cx="70%" cy="65%" r="50%">
                        <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
                        <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
                    </radialGradient>
                    <radialGradient id="orb3" cx="50%" cy="20%" r="45%">
                        <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
                        <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
                    </radialGradient>
                </defs>
                <rect width="1920" height="1080" fill="#060913"/>
                <circle id="svg-orb-1" cx="550" cy="380" r="550" fill="url(#orb1)"/>
                <circle id="svg-orb-2" cx="1350" cy="700" r="600" fill="url(#orb2)"/>
                <circle id="svg-orb-3" cx="960" cy="250" r="480" fill="url(#orb3)"/>
            </svg>
            <img id="custom-bg-img" src="" alt="Custom Background" class="hidden" />
        </div>
        <div class="parallax-layer ambient-grid" data-depth="0.08"></div>
    </div>

    <!-- Centered App Grid Workspace -->
    <main id="workspace">
        <div id="app-grid" class="liquid-grid">
            <!-- Populated dynamically via dashboard.js -->
        </div>
    </main>

    <!-- Floating Liquid Glass Settings Trigger -->
    <button id="settings-trigger" class="liquid-glass-pill ui-chrome" title="Server Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Settings</span>
    </button>

    <!-- Expanding Liquid Glass Iframe Stage -->
    <div id="iframe-Stage" class="iframe-stage hidden">
        <div id="iframe-window" class="liquid-glass-window">
            <div class="iframe-header">
                <span id="iframe-title">Application</span>
                <button id="iframe-close" class="liquid-close-btn" title="Close (Esc)">✕</button>
            </div>
            <iframe id="app-iframe" src="about:blank" allowfullscreen></iframe>
        </div>
    </div>

    <!-- True Liquid Glass Settings Modal -->
    <div id="settings-modal" class="modal-backdrop hidden">
        <div class="liquid-glass-modal">
            <div class="modal-header">
                <h2>Liquid Glass Settings</h2>
                <button id="settings-close" class="liquid-close-btn">✕</button>
            </div>

            <div class="modal-body">
                <!-- Add New App Widget Form -->
                <form id="add-app-form" class="glass-card">
                    <h3>Add App Widget</h3>
                    <div class="form-grid">
                        <div class="form-row">
                            <label>App Name</label>
                            <input type="text" class="glass-input" name="name" placeholder="Jellyfin, Nextcloud..." required />
                        </div>
                        <div class="form-row">
                            <label>Target URL</label>
                            <input type="url" class="glass-input" name="url" placeholder="https://..." required />
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-row">
                            <label>Transparent Icon (PNG/SVG)</label>
                            <input type="file" class="glass-file-input" name="icon_file" accept=".png,.svg,.webp,.gif" />
                        </div>
                        <div class="form-row">
                            <label>Or Icon URL</label>
                            <input type="url" class="glass-input" name="icon_url" placeholder="https://.../icon.png" />
                        </div>
                    </div>
                    <label class="glass-toggle-row" for="iframe-toggle">
                        <input type="checkbox" id="iframe-toggle" name="iframe" value="true" checked />
                        <span class="glass-toggle-slider"></span>
                        <span class="glass-toggle-label">Expand inside Liquid Glass Iframe</span>
                    </label>
                    <button type="submit" class="liquid-submit-btn">Add Widget</button>
                </form>

                <!-- Background Configuration -->
                <form id="bg-form" class="glass-card">
                    <h3>Wallpaper (SVG / PNG / WebP)</h3>
                    <div class="form-grid">
                        <div class="form-row">
                            <label>Upload Wallpaper</label>
                            <input type="file" class="glass-file-input" name="bg_file" accept=".svg,.png,.jpg,.jpeg,.webp" />
                        </div>
                        <div class="form-row">
                            <label>Or Wallpaper Path/URL</label>
                            <input type="text" class="glass-input" name="bg_url" placeholder="Blank = Default SVG" />
                        </div>
                    </div>
                    <button type="submit" class="liquid-submit-btn">Update Wallpaper</button>
                </form>

                <!-- Installed Widgets List -->
                <div class="glass-card">
                    <h3>Installed Widgets</h3>
                    <div id="settings-app-list" class="settings-app-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/boot_anim.js"></script>
    <script src="/static/js/parallax.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
